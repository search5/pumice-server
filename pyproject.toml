[project]
name = "pumice-server"
version = "0.2.8"
description = "Self-hosted sync/version-history/publish backend for the Pumice Obsidian plugin."
readme = "README.md"
authors = [
    { name = "Ji-ho Lee", email = "search5@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "markdown>=3.10.2",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
    "pyramid>=2.1",
    "python-dotenv>=1.2.2",
    "twisted>=26.4.0",
    "sqlalchemy-cubrid",
    "mcp>=2.0.0",
    "cryptography>=50.0.0",
    "pyramid-jinja2>=2.10.1",
    "babel>=2.18.0",
    "pumice-plugin-immich>=0.1.0",
    "autobahn[twisted]>=26.7.1",
]

[project.urls]
Repository = "https://github.com/search5/pumice-server"

[project.scripts]
server = "pumice_server.main:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
sqlalchemy-cubrid = { git = "https://github.com/search5/sqlalchemy_cubrid" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-twisted>=1.14.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
